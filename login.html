<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h1>ICT Service Request System</h1>
            <p class="login-subtitle">Sign in to continue</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <div id="loginError" class="error-message" style="display:none;"></div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>
            <p class="login-hint">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>

            <form id="signupForm" style="display:none; margin-top:1rem;">
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required placeholder="Create a password" minlength="6">
                </div>
                <div id="signupError" class="error-message" style="display:none;"></div>
                <div id="signupSuccess" class="success-message" style="display:none;"></div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>
            <p class="login-hint" id="backToLoginHint" style="display:none;">Already have an account? <a href="#" id="showLogin">Login</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
